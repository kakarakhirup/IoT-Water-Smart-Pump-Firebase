<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Water Pump Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      background: #0f172a;
      color: #e5e7eb;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #020617;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transition: transform .2s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .card h2 {
      font-size: 16px;
      font-weight: 400;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    .value {
      font-size: 32px;
      font-weight: 600;
    }

    .status-on {
      color: #22c55e;
    }

    .status-off {
      color: #ef4444;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background .2s;
    }

    .btn-on {
      background: #22c55e;
      color: #022c22;
    }

    .btn-on:hover {
      background: #16a34a;
    }

    .btn-off {
      background: #ef4444;
      color: #450a0a;
    }

    .btn-off:hover {
      background: #dc2626;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>ESP32 Water Pump Control</h1>

    <div class="grid">
      <div class="card">
        <h2>Jarak Air</h2>
        <div class="value" id="distance">-- cm</div>
      </div>

      <div class="card">
        <h2>Status Pompa</h2>
        <div class="value" id="pumpStatus">--</div>

        <div class="btn-group">
          <button class="btn-on" onclick="setPump('ON')">ON</button>
          <button class="btn-off" onclick="setPump('OFF')">OFF</button>
        </div>
      </div>
    </div>

    <footer>
      Firebase Realtime Control • ESP32
    </footer>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "xxx",
      databaseURL: "xxx"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const distanceEl = document.getElementById("distance");
    const pumpEl = document.getElementById("pumpStatus");

    onValue(ref(db, "sensor/distance_cm"), snapshot => {
      const value = snapshot.val();
      distanceEl.innerText = value !== null ? value + " cm" : "-- cm";
    });

    onValue(ref(db, "pump/status"), snapshot => {
      const status = snapshot.val() || "--";
      pumpEl.innerText = status;
      pumpEl.className = "value " + (status === "ON" ? "status-on" : "status-off");
    });

    window.setPump = function(state) {
      set(ref(db, "pump/status"), state);
    };
  </script>
</body>
</html>
